name: Build Mochy Resona Release

on:
  workflow_dispatch:
  push:
    branches:
      - clean-v8.4.2.2

permissions:
  contents: write

jobs:
  build_arm64:
    name: Build Arm64 Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Expand Swap Memory
        run: |
          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Generate Keystore for Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Arm64 FOSS Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options=-Xmx4096M -XX:+UseParallelGC"
        run: |
          ./gradlew :app:assembleArm64FossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Prepare Arm64 APK
        run: |
          cd app/build/outputs/apk/arm64Foss/release
          cp *.apk Mochy-Resona-v8.4.3-arm64.apk

      - name: Upload Arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Resona-v8.4.3-arm64
          path: app/build/outputs/apk/arm64Foss/release/Mochy-Resona-v8.4.3-arm64.apk
          retention-days: 30

      - name: Publish Arm64 to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app/build/outputs/apk/arm64Foss/release
          gh release upload "v8.4.3-resona" Mochy-Resona-v8.4.3-arm64.apk --clobber || \
          gh release create "v8.4.3-resona" Mochy-Resona-v8.4.3-arm64.apk --title "Mochy Resona v8.4.3" --clobber

