name: Build Mochy Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-generated timestamp tag)'
        required: false
        default: ''
  push:
    branches:
      - 'clean-*'
      - 'main'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Arm64 Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Generate Keystore for Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Arm64 FOSS Release APK
        run: |
          ./gradlew :app:assembleArm64FossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Rename APK for Release
        run: |
          cd app/build/outputs/apk/arm64Foss/release
          mv *.apk Mochy-Music-v8.4.3-arm64-Deezer.apk

      - name: Upload Arm64 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-v8.4.3-arm64-Deezer
          path: app/build/outputs/apk/arm64Foss/release/Mochy-Music-v8.4.3-arm64-Deezer.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$INPUT_TAG" ]; then
            TAG="v8.4.3-deezer-$(date +'%Y%m%d-%H%M')"
          else
            TAG="$INPUT_TAG"
          fi
          
          gh release create "$TAG" \
            app/build/outputs/apk/arm64Foss/release/Mochy-Music-v8.4.3-arm64-Deezer.apk \
            --title "Mochy Music v8.4.3 (Deezer Edition - $TAG)" \
            --notes "## 🎵 Mochy Music v8.4.3 - Deezer Edition
Official Upstream Sync + Lossless Deezer + Jitter-Free Audio

### ✨ What's Included:
- **Upstream v8.4.3 Sync**: Exact parity with official upstream release (tag \`mochy-8.4.3\`, commit \`a5bc898b\`).
- **Native Deezer Source Module**: Native FLAC (lossless) & 320kbps MP3 streaming with Blowfish CBC 2048-byte stripe decryption and local stream loopback server.
- **Geo-Unblock Proxy Support**: Built-in selectable proxies (UK 1, UK 2, RU 1, RU 2, MD) enabling Deezer streaming in unsupported countries like India.
- **Micro-Stutter / Audio Jitter Fix**: Stripped heavy debug logging and logcat spam for smooth background playback.
- **Minimal Default Setup**: Default modules are **Monochrome** and **Deezer** only.
- **Cleaned Integrations**: Removed non-working Last.fm & Libre.fm rows from the Integrations UI.
- **Architecture**: \`arm64-v8a\` (Optimized for modern Android devices)."
