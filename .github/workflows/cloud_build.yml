name: Build Mochy Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'clean-*'
      - 'main'

jobs:
  build_release:
    name: Build Arm64 & Universal Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build Arm64 FOSS Release APK
        run: |
          ./gradlew :app:assembleArm64FossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Arm64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-Music-Arm64-Release
          path: app/build/outputs/apk/arm64Foss/release/*.apk
          retention-days: 30
